name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install services
        run: |
          python -m pip install --upgrade pip
          pip install -e shared/python -e 'agent[dev]' -e 'app/backend[dev]' -e 'pet_pipeline[dev]'
      - name: Lint
        run: ruff check shared/python agent app/backend pet_pipeline
      - name: Test Agent
        run: pytest agent/tests
      - name: Test App API
        run: pytest app/backend/tests
      - name: Test Pet Pipeline
        run: pytest pet_pipeline/tests

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run doctor
