services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8001:8001"

  pet-pipeline:
    build:
      context: .
      dockerfile: pet_pipeline/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8002:8002"

  app-api:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_SERVICE_URL: http://agent:8001
      PET_PIPELINE_URL: http://pet-pipeline:8002
    depends_on:
      - agent
      - pet-pipeline
    ports:
      - "8000:8000"
