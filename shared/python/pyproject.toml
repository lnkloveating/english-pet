[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "shengsheng-contracts"
version = "0.1.0"
description = "Shared Python contracts for Shengsheng Island services"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["shengsheng_contracts"]
